<!-- Quiet list — index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ivan’s personal projects: websites, maps, and small tools.">
  <title>Ivan — Portfolio</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #111112;
      --text: #e9e9e7;
      --muted: #a2a2a5;
      --border: #2c2c2f;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font-family: Arial, sans-serif; }
    h1, h2, p { margin: 0; }
    a { color: inherit; text-decoration: none; text-underline-offset: 4px; }
    a:hover { text-decoration: underline; }
    button { font: inherit; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 1px solid currentColor; outline-offset: 5px; }

    .page {
      width: min(100%, 670px);
      min-height: 100svh;
      margin: auto;
      padding: 45px 50px;
      display: flex;
      flex-direction: column;
    }

    header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
    .name { font-size: 13px; }
    .socials { display: flex; flex-wrap: wrap; gap: 20px; font-size: 12px; color: var(--muted); }

    .intro { padding: 60px 0 34px; }
    .intro h1 { font-size: 29px; line-height: 1.2; font-weight: 400; letter-spacing: -.045em; }
    .intro p { margin-top: 15px; color: var(--muted); font-size: 14px; line-height: 1.75; }

    .filters { display: flex; flex-wrap: wrap; gap: 17px; }
    .filters button { padding: 7px 0; border: 0; background: none; color: var(--muted); font-size: 12px; }
    .filters button[aria-pressed="true"] { color: var(--text); text-decoration: underline; text-underline-offset: 6px; }

    .project { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 25px 0; border-bottom: 1px solid var(--border); }
    .project h2 { font-size: 22px; font-weight: 400; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .project p { margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .links { display: flex; align-items: start; gap: 16px; padding-top: 4px; color: var(--muted); font-size: 11px; white-space: nowrap; }

    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-top: auto; padding-top: 35px; color: var(--muted); font-size: 11px; }

    @media (max-width: 600px) {
      .page { padding: 30px 24px; }
      .project { grid-template-columns: 1fr; gap: 10px; }
      .links { padding: 0; }
    }

    @media (max-width: 380px) {
      header { flex-direction: column; gap: 17px; }
      .intro { padding-top: 42px; }
    }

    @media (pointer: coarse) {
      .filters button { min-height: 44px; }
      .links a, .socials a { display: inline-flex; align-items: center; min-height: 44px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <span class="name">potuzhnyj</span>
      <nav class="socials" aria-label="Social links">
        <a href="https://github.com/potuzhnyj" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        <a href="https://linkedin.com/in/ivanmosak/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      </nav>
    </header>

    <section class="intro">
      <h1>Hello, I’m Ivan.</h1>
      <p>I build websites and small tools.<br>Here are a few things I’ve made.</p>
    </section>

    <nav class="filters" aria-label="Project categories">
      <button type="button" data-category="all" aria-pressed="true">All</button>
      <button type="button" data-category="ui" aria-pressed="false">UI</button>
      <button type="button" data-category="apps" aria-pressed="false">Apps</button>
      <button type="button" data-category="maps" aria-pressed="false">Maps</button>
      <button type="button" data-category="tools" aria-pressed="false">Tools</button>
    </nav>

    <section id="projects" aria-label="Projects" aria-live="polite"></section>
  </main>

  <script>
    const projects = [
      {
        name: "pixelgames",
        category: "ui",
        description: "A pixel-art game discovery website concept.",
        live: "https://potuzhnyj.github.io/pixelgames/",
        source: "https://github.com/potuzhnyj/pixelgames"
      },
      {
        name: "organicsearch",
        category: "apps",
        description: "Google results, exported as JSON or CSV.",
        live: "https://organicsearch.onrender.com/",
        source: "https://github.com/potuzhnyj/organicsearch"
      },
      {
        name: "parcelmap",
        category: "maps",
        description: "Explore cadastral parcels in the Jičín area.",
        live: "https://potuzhnyj.github.io/parcelmap/",
        source: "https://github.com/potuzhnyj/parcelmap"
      },
      {
        name: "InvestAI",
        category: "apps",
        description: "A browser-based investing assistant.",
        live: "https://potuzhnyj.github.io/investai/",
        source: "https://github.com/potuzhnyj/InvestAI"
      },
      {
        name: "Gmail Coupon Grabber",
        category: "tools",
        description: "Promotional emails turned into a clean report.",
        source: "https://github.com/potuzhnyj/Gmail-Coupon-Grabber"
      }
    ];

    const list = document.getElementById("projects");
    const filters = document.querySelectorAll("[data-category]");

    function render(category = "all") {
      list.innerHTML = projects
        .filter(project => category === "all" || project.category === category)
        .map(project => `
          <article class="project">
            <div>
              <h2>
                <a href="${project.live || project.source}" target="_blank" rel="noopener noreferrer">${project.name}</a>
              </h2>
              <p>${project.description}</p>
            </div>
            <nav class="links" aria-label="${project.name} links">
              ${project.live ? `<a href="${project.live}" target="_blank" rel="noopener noreferrer">Live ↗</a>` : ""}
              <a href="${project.source}" target="_blank" rel="noopener noreferrer">Source ↗</a>
            </nav>
          </article>
        `).join("");
    }

    filters.forEach(button => {
      button.addEventListener("click", () => {
        filters.forEach(filter => {
          filter.setAttribute("aria-pressed", String(filter === button));
        });
        render(button.dataset.category);
      });
    });

    render();
  </script>
</body>
</html>
